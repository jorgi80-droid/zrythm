name: Zrythm native Android port feasibility build

on:
  workflow_dispatch:
  push:
    branches:
      - android-native-port
    paths:
      - 'src/gui/qml/**'
      - 'src/gui/qml/views/ProjectWindow.qml'
      - '.github/workflows/android-native-port.yml'

permissions:
  contents: read

jobs:
  linux-source-and-configure:
    name: Validate source and configure native Qt build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-19 cmake ninja-build pkg-config flex gettext python3 python3-venv \
            libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libxfixes-dev libxi-dev libxkbcommon-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev libpulse-dev libsndfile1-dev liblilv-dev \
            libgtk-3-dev libdbus-1-dev libwayland-dev wayland-protocols libpipewire-0.3-dev

      - name: Install Python build tools
        run: |
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          conan config install conan
          conan remote add conan-local-index ext/conan-center-index || true
          python3 tools/export_conan_recipes.py
          conan install . -pr:h clang_release -pr:b clang_release --build=missing

      - name: Configure native Linux reference build
        run: |
          cmake -S . -B build-mobile-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \

            -DZRYTHM_TESTS=OFF \
            -DZRYTHM_QML_TESTS=OFF \
            -DZRYTHM_BENCHMARKS=OFF \
            -DZRYTHM_MANPAGE=OFF \
            -DZRYTHM_SHELL_COMPLETIONS=OFF \
            -DZRYTHM_USER_MANUAL=OFF \
            -DZRYTHM_STRICT=OFF \\
            -DCMAKE_TOOLCHAIN_FILE=conanbuild-ci/build/Release/generators/conan_toolchain.cmake
