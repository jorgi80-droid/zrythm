name: Android Portability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - android-port-prototype
    paths:
      - '.github/workflows/android-port-audit.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'ext/**'

permissions:
  contents: read

jobs:
  audit:
    name: Inspect Android portability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate initial audit report
        shell: bash
        run: |
          set +e
          mkdir -p audit-output
          {
            echo "# Zrythm Android Portability Audit"
            echo
            echo "This is a static source audit only. It does not build an APK and does not prove Android compatibility."
            echo
            echo "## Repository revision"
            git log -1 --format='- Commit: %H%n- Date: %cI%n- Subject: %s'
            echo
            echo "## Android-related references"
            git grep -n -i -E 'android|ANDROID|Q_OS_ANDROID|__ANDROID__|CMAKE_ANDROID' -- ':!*.svg' ':!*.png' ':!*.jpg' > audit-output/android-references.txt
            if [ -s audit-output/android-references.txt ]; then
              cat audit-output/android-references.txt
            else
              echo "No matching references found by this search."
            fi
            echo
            echo "## Platform-specific APIs and desktop assumptions"
            git grep -n -i -E 'xdg-open|gtk|jack|alsa|pipewire|desktop|WIN32|APPLE|UNIX|Q_OS_LINUX' -- CMakeLists.txt src ext > audit-output/platform-references.txt
            if [ -s audit-output/platform-references.txt ]; then
              head -n 250 audit-output/platform-references.txt
              echo
              echo "See platform-references.txt artifact for up to the full captured search output."
            else
              echo "No matching references found by this search."
            fi
            echo
            echo "## Build prerequisites from root CMakeLists.txt"
            grep -n -E 'cmake_minimum_required|CMAKE_CXX_STANDARD|find_package\(|FetchContent|CPM|Qt|JUCE|JUCE' CMakeLists.txt | head -n 160
            echo
            echo "## Initial conclusion"
            echo "- This workflow is an inventory step, not an Android build."
            echo "- Next work requires an Android-specific Qt/JUCE configuration, native audio backend review, and dependency-by-dependency validation."
          } > audit-output/ANDROID_PORT_AUDIT.md
          printf 'Audit generated.\n'
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: zrythm-android-port-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
