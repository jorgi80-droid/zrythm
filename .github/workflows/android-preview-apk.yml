name: Build Zrythm Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port-prototype
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-preview-apk.yml'

permissions:
  contents: read

jobs:
  build-preview:
    name: Build landscape UI preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 5 -type f -name sdkmanager -print
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"

      - name: Build debug APK
        working-directory: android-prototype
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zrythm-mobile-preview-debug-apk
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
